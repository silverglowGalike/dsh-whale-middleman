<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="主会话盘问收敛后派发两张挂起的子会话工单，其中一张交回汇报">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#8b95a5"/>
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- 主会话：盘问 -->
  <rect x="40" y="110" width="120" height="80" rx="12" fill="#8b95a5" fill-opacity="0.10" stroke="#8b95a5" stroke-width="2"/>
  <path d="M60 134 H132" stroke="#8b95a5" stroke-width="4" stroke-linecap="round" stroke-opacity="0.55"/>
  <path d="M60 152 H120" stroke="#8b95a5" stroke-width="4" stroke-linecap="round" stroke-opacity="0.55"/>
  <path d="M60 170 H128" stroke="#8b95a5" stroke-width="4" stroke-linecap="round" stroke-opacity="0.55"/>

  <!-- 派发 -->
  <path d="M166 150 H204" stroke="#8b95a5" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 挂起的工单：暂停条 -->
  <rect x="212" y="96" width="138" height="108" rx="12" fill="#d97706" fill-opacity="0.10" stroke="#d97706" stroke-width="2.5"/>
  <rect x="268" y="130" width="10" height="40" rx="3" fill="#d97706"/>
  <rect x="286" y="130" width="10" height="40" rx="3" fill="#d97706"/>
  <path d="M232 176 H330" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-opacity="0.45"/>

  <!-- 两路并行 -->
  <path d="M356 150 H378 V110 H390" stroke="#8b95a5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M356 150 H378 V190 H390" stroke="#8b95a5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 子会话 A：跑完 -->
  <rect x="396" y="80" width="118" height="60" rx="12" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2"/>
  <path d="M414 110 L426 122 L448 94" stroke="#16a34a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 子会话 B：还在等你拍板 -->
  <rect x="396" y="180" width="118" height="60" rx="12" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2"/>
  <circle cx="455" cy="210" r="5" fill="#d97706"/>
  <circle cx="472" cy="210" r="5" fill="#d97706" fill-opacity="0.45"/>
  <circle cx="489" cy="210" r="5" fill="#d97706" fill-opacity="0.20"/>

  <!-- 汇报回流 -->
  <path d="M455 246 V268 H100 V200" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#arrow-return)"/>
</svg>
